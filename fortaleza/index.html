<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#120c08" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>A Fortaleza de Areia</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app">
    <div id="stage"><canvas id="screen" aria-label="Tela do jogo"></canvas></div>
    <div id="controls">
      <div id="dpad" role="group" aria-label="Direcional">
        <span class="arrow up">▲</span>
        <span class="arrow right">▶</span>
        <span class="arrow down">▼</span>
        <span class="arrow left">◀</span>
      </div>
      <button id="action" type="button" aria-label="Ação">Ação</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
